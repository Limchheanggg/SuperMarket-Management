<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Background rounded square -->
  <rect width="44" height="44" rx="10" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2472"/>
      <stop offset="100%" stop-color="#0d1240"/>
    </linearGradient>
  </defs>
  <!-- Shine overlay -->
  <rect x="0" y="0" width="44" height="19" rx="10" fill="rgba(255,255,255,0.1)"/>
  <!-- Left bar (white) -->
  <rect x="7" y="14" width="7" height="20" rx="2" fill="rgba(255,255,255,0.93)"/>
  <!-- Middle bar (red) -->
  <rect x="18" y="20" width="7" height="14" rx="2" fill="#c0272d"/>
  <!-- Right bar (white) -->
  <rect x="29" y="10" width="7" height="24" rx="2" fill="rgba(255,255,255,0.93)"/>
  <!-- Red underline -->
  <rect x="7" y="36" width="29" height="2.5" rx="1.2" fill="#c0272d"/>
</svg>
